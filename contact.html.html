<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Confession Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; color: #333; line-height: 1.6; margin: 0; padding: 0; }
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d93838; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #111; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        button { background: #111; color: #fff; padding: 12px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #d93838; }
        .back-link { display: inline-block; margin-top: 20px; color: #333; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header><h1>Confession Hub</h1></header>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Have a secret story to share or any inquiries? Reach out to us using the form below.</p>
        <form action="#" method="POST" style="margin-top: 20px;">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Your Email</label>
                <input type="email5" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Message / Story</label>
                <textarea rows="5" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>
</body>
</html>
